name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chenji-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Felix server
    runs-on: ubuntu-latest
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/chenji-learning-hub' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Validate deployment secrets
        run: |
          test -n "$DEPLOY_USER" || (echo "DEPLOY_USER is required" && exit 1)
          test -n "$DEPLOY_SSH_KEY" || (echo "DEPLOY_SSH_KEY is required" && exit 1)

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/chenji_deploy_key
          chmod 600 ~/.ssh/chenji_deploy_key
          ssh-keyscan -p 22 -H 47.242.176.227 >> ~/.ssh/known_hosts

      - name: Check SSH connection
        run: |
          nc -vz -w 10 47.242.176.227 22
          ssh -vvv -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -i ~/.ssh/chenji_deploy_key -p 22 "$DEPLOY_USER@47.242.176.227" \
            "echo ssh-ok"

      - name: Deploy on server
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -i ~/.ssh/chenji_deploy_key -p 22 "$DEPLOY_USER@47.242.176.227" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git pull --ff-only
          chmod +x scripts/deploy-production.sh
          ./scripts/deploy-production.sh
          REMOTE
