name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chenji-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Felix server
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/chenji-learning-hub' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      RELEASE_ARCHIVE: /tmp/chenji-release-${{ github.run_id }}.tar.gz

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Package release
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/chenji-release.tar.gz" HEAD

      - name: Validate deployment secrets
        run: |
          test -n "$DEPLOY_HOST" || (echo "DEPLOY_HOST is required" && exit 1)
          test -n "$DEPLOY_USER" || (echo "DEPLOY_USER is required" && exit 1)
          test -n "$DEPLOY_SSH_KEY" || (echo "DEPLOY_SSH_KEY is required" && exit 1)

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/chenji_deploy_key
          chmod 600 ~/.ssh/chenji_deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Check SSH connection
        run: |
          nc -vz -w 10 "$DEPLOY_HOST" "$DEPLOY_PORT"
          ssh -vvv -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -i ~/.ssh/chenji_deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo ssh-ok"

      - name: Upload release
        run: |
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -i ~/.ssh/chenji_deploy_key -P "$DEPLOY_PORT" \
            "$RUNNER_TEMP/chenji-release.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$RELEASE_ARCHIVE"

      - name: Deploy on server
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -i ~/.ssh/chenji_deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_ARCHIVE='$RELEASE_ARCHIVE' bash -s" <<'REMOTE'
          set -euo pipefail

          DEPLOY_PATH="${DEPLOY_PATH%/}"
          if [ "$DEPLOY_PATH" != "/opt/chenji-learning-hub" ]; then
            echo "Refusing to bootstrap unexpected DEPLOY_PATH: $DEPLOY_PATH" >&2
            echo "Set DEPLOY_PATH to /opt/chenji-learning-hub." >&2
            exit 1
          fi

          if [ ! -f "$RELEASE_ARCHIVE" ]; then
            echo "Uploaded release archive not found: $RELEASE_ARCHIVE" >&2
            exit 1
          fi

          tar -tzf "$RELEASE_ARCHIVE" >/dev/null

          parent_dir="$(dirname "$DEPLOY_PATH")"
          mkdir -p "$parent_dir"
          staging_dir="$(mktemp -d "$parent_dir/.chenji-learning-hub-release.XXXXXX")"
          tar -xzf "$RELEASE_ARCHIVE" -C "$staging_dir"

          for required_file in docker-compose.server.yml scripts/deploy-production.sh; do
            if [ ! -f "$staging_dir/$required_file" ]; then
              echo "Release archive is missing $required_file" >&2
              exit 1
            fi
          done

          backup_dir=""
          if [ -e "$DEPLOY_PATH" ]; then
            backup_dir="${DEPLOY_PATH}.pre-release-$(date +%Y%m%d%H%M%S)"
            mv "$DEPLOY_PATH" "$backup_dir"
            echo "Previous source directory backed up to $backup_dir"
          fi

          if ! mv "$staging_dir" "$DEPLOY_PATH"; then
            if [ -n "$backup_dir" ] && [ ! -e "$DEPLOY_PATH" ]; then
              mv "$backup_dir" "$DEPLOY_PATH"
            fi
            echo "Failed to install the uploaded release" >&2
            exit 1
          fi

          if [ -n "$backup_dir" ] && [ -f "$backup_dir/.env" ]; then
            cp -p "$backup_dir/.env" "$DEPLOY_PATH/.env"
            echo "Preserved the existing production .env"
          fi

          if [ ! -f "$DEPLOY_PATH/.env" ]; then
            echo "Missing production .env in $DEPLOY_PATH" >&2
            if [ -n "$backup_dir" ]; then
              failed_dir="${DEPLOY_PATH}.failed-release-$(date +%Y%m%d%H%M%S)"
              mv "$DEPLOY_PATH" "$failed_dir"
              mv "$backup_dir" "$DEPLOY_PATH"
              echo "Restored the previous deployment directory; failed release kept at $failed_dir" >&2
            fi
            exit 1
          fi

          cd "$DEPLOY_PATH"
          bash scripts/deploy-production.sh
          rm -f "$RELEASE_ARCHIVE"
          REMOTE
